services:
  casedesk:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: casedesk-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DOCKER_DATABASE_URL:?DOCKER_DATABASE_URL must be set}
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET must be set to a long random value}
      - DB_MIGRATION_MODE=${DB_MIGRATION_MODE:-deploy}
      - ALLOW_DB_PUSH=${ALLOW_DB_PUSH:-false}
      - DB_MIGRATION_RETRIES=${DB_MIGRATION_RETRIES:-10}
      - TRUSTED_PROXY=${TRUSTED_PROXY:-false}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - NEXT_PUBLIC_APP_NAME=${NEXT_PUBLIC_APP_NAME:-Open Vaartha CaseDesk}
      - NEXT_PUBLIC_CITIZEN_PORTAL_URL=${NEXT_PUBLIC_CITIZEN_PORTAL_URL:-http://localhost:3001}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - APP_URL=${APP_URL:-http://localhost:3000}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-Open Vaartha CaseDesk <no-reply@openvaartha.com>}
      - WORKSPACE_NOTIFY_EMAIL=${WORKSPACE_NOTIFY_EMAIL:-}
    # No external ports — access via Docker network only
    volumes:
      - casedesk-uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - casedesk-net

  citizen-portal:
    build:
      context: ./citizen-portal
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_CASEDESK_API_URL: ${NEXT_PUBLIC_CASEDESK_API_URL:-http://localhost:3000}
        NEXT_PUBLIC_DEFAULT_SLUG: ${NEXT_PUBLIC_DEFAULT_SLUG:-janata-investigation-desk}
    container_name: citizen-portal-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      - INTERNAL_CASEDESK_URL=http://casedesk:3000
      - NEXT_PUBLIC_CASEDESK_API_URL=${NEXT_PUBLIC_CASEDESK_API_URL:-http://localhost:3000}
      - NEXT_PUBLIC_DEFAULT_SLUG=${NEXT_PUBLIC_DEFAULT_SLUG:-janata-investigation-desk}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
    # No external ports — access via Docker network only
    depends_on:
      casedesk:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - casedesk-net

volumes:
  casedesk-uploads:
    driver: local

networks:
  casedesk-net:
    driver: bridge
