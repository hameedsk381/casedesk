services:
  mysql:
    image: mysql:8
    container_name: casedesk-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password_2026}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-casedesk}
      MYSQL_USER: ${MYSQL_USER:-casedesk}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-casedesk_password_2026}
    # Ports only accessible within Docker network (use `podman exec` to reach services)
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u $$MYSQL_USER -p$$MYSQL_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s
    networks:
      - casedesk-net

  casedesk:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: casedesk-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DOCKER_DATABASE_URL:-mysql://casedesk:casedesk_password_2026@mysql:3306/casedesk}
      - SESSION_SECRET=${SESSION_SECRET:-casedesk-production-secret-jwt-key-2026}
      - NEXT_PUBLIC_APP_NAME=${NEXT_PUBLIC_APP_NAME:-Open Vaartha CaseDesk}
      - NEXT_PUBLIC_CITIZEN_PORTAL_URL=${NEXT_PUBLIC_CITIZEN_PORTAL_URL:-http://localhost:3001}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - UPLOAD_DIR=/app/uploads
      - APP_URL=${APP_URL:-http://localhost:3000}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-Open Vaartha CaseDesk <no-reply@openvaartha.com>}
      - WORKSPACE_NOTIFY_EMAIL=${WORKSPACE_NOTIFY_EMAIL:-}
    # No external ports — access via Docker network only
    volumes:
      - casedesk-uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/search?q=ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - casedesk-net

  citizen-portal:
    build:
      context: ./citizen-portal
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_CASEDESK_API_URL: ${NEXT_PUBLIC_CASEDESK_API_URL:-http://localhost:3000}
        NEXT_PUBLIC_DEFAULT_SLUG: ${NEXT_PUBLIC_DEFAULT_SLUG:-janata-investigation-desk}
    container_name: citizen-portal-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      - INTERNAL_CASEDESK_URL=http://casedesk:3000
      - NEXT_PUBLIC_CASEDESK_API_URL=${NEXT_PUBLIC_CASEDESK_API_URL:-http://localhost:3000}
      - NEXT_PUBLIC_DEFAULT_SLUG=${NEXT_PUBLIC_DEFAULT_SLUG:-janata-investigation-desk}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
    # No external ports — access via Docker network only
    depends_on:
      casedesk:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - casedesk-net

volumes:
  mysql-data:
    driver: local
  casedesk-uploads:
    driver: local

networks:
  casedesk-net:
    driver: bridge
